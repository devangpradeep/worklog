[package]
name = "worklog-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
chrono = "0.4"
csv = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
